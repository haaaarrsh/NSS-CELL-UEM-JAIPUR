<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="url(#bgGrad)"/>
  <g transform="translate(0, 15)">
    <!-- Soft circular aura -->
    <circle cx="200" cy="180" r="105" fill="#cbd5e1" opacity="0.45"/>
    <circle cx="200" cy="180" r="90" fill="#cbd5e1" opacity="0.6"/>
    <!-- Head -->
    <circle cx="200" cy="155" r="48" fill="url(#avatarGrad)"/>
    <!-- Shoulders -->
    <path d="M105,275 C105,215 145,210 200,210 C255,210 295,215 295,275 Z" fill="url(#avatarGrad)"/>
  </g>
</svg>
