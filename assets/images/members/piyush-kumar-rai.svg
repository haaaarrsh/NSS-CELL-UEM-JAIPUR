<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_PR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow_PR" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="400" height="450" fill="#f8fafc" rx="16"/>
  <rect x="15" y="15" width="370" height="420" rx="12" fill="url(#grad_PR)" opacity="0.08"/>
  
  <!-- Outer portrait ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#grad_PR)" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="200" cy="180" r="100" fill="url(#grad_PR)" filter="url(#shadow_PR)"/>
  
  <!-- Silhouette / Monogram -->
  <text x="200" y="206" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    PR
  </text>
  
  <!-- Badge Ribbon on Avatar -->
  <rect x="70" y="320" width="260" height="34" rx="17" fill="#0b2545" filter="url(#shadow_PR)"/>
  <text x="200" y="342" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#f1c40f" text-anchor="middle" letter-spacing="1.5">
    NSS CELL UEM JAIPUR
  </text>

  <!-- Member Name & Role -->
  <text x="200" y="390" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">
    Piyush Kumar Rai
  </text>
  <text x="200" y="418" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#e63946" text-anchor="middle">
    President (2023-24)
  </text>
</svg>
