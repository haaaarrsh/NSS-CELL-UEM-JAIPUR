<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_MK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a80" />
      <stop offset="100%" stop-color="#293241" />
    </linearGradient>
    <filter id="shadow_MK" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="400" height="450" fill="#f8f9fa" rx="16"/>
  <rect x="15" y="15" width="370" height="420" rx="12" fill="url(#grad_MK)" opacity="0.12"/>
  
  <!-- Outer portrait ring -->
  <circle cx="200" cy="170" r="110" fill="none" stroke="url(#grad_MK)" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="200" cy="170" r="100" fill="url(#grad_MK)" filter="url(#shadow_MK)"/>
  
  <!-- Silhouette / Monogram -->
  <text x="200" y="195" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    MK
  </text>
  
  <!-- Badge Ribbon on Avatar -->
  <rect x="70" y="300" width="260" height="34" rx="17" fill="#0b2545" filter="url(#shadow_MK)"/>
  <text x="200" y="322" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#f1c40f" text-anchor="middle" letter-spacing="1.5">
    NSS CELL UEM JAIPUR
  </text>

  <!-- Member Name & Role Preview in SVG -->
  <text x="200" y="375" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">
    Mohit Kumawat
  </text>
  <text x="200" y="405" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#e63946" text-anchor="middle">
    Logistics Head
  </text>
</svg>